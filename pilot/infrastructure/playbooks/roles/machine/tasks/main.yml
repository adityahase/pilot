---
- name: Download Linux kernel
  shell: wget https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/v1.12/x86_64/vmlinux-6.1.128

- name: Download Ubuntu 24.04 rootfs
  shell: wget -O ubuntu-24.04.squashfs.upstream "https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/v1.12/x86_64/ubuntu-24.04.squashfs"

- name: Export rootfs
  shell: |
    rm -rf squashfs-root || true
    unsquashfs ubuntu-24.04.squashfs.upstream

- name: Add ssh key to rootfs
  shell: |
    rm id_ed25519* || true
    ssh-keygen -t ed25519 -f id_ed25519 -N ""
    cp -v id_ed25519.pub squashfs-root/root/.ssh/authorized_keys
    cp -v id_ed25519 ./ubuntu-24.04.id_ed25519

- name: Setup DNS resolvers
  shell: echo "nameserver 8.8.8.8" > squashfs-root/etc/resolv.conf

- name: Make ext4 filesystem from rootfs
  shell: |
    chown -R root:root squashfs-root
    truncate -s 400M ubuntu-24.04.ext4
    mkfs.ext4 -d squashfs-root -F ubuntu-24.04.ext4

- name: Delete firecracker tap device
  shell: ip link del tap0
  ignore_errors: true

- name: Create firecracker tap device
  shell: |
    ip tuntap add dev tap0 mode tap
    ip link set dev tap0 master firecracker0
    ip link set dev tap0 up

- name: Copy Firecracker VM config
  template:
    src: vmconfig.json
    dest: vmconfig.json

- name: Create chroot directory
  file:
    path: firecracker-root
    state: directory

- name: Reset chroot VM directory
  shell: rm -rf firecracker-root/firecracker/1/root/*
  ignore_errors: true
  # 1 is the VM ID, it can be anything, but must match the jailer --id

- name: Copy VM files
  shell: |
    mkdir -p firecracker-root/firecracker/1/root
    cp -v vmconfig.json firecracker-root/firecracker/1/root/
    cp -v ubuntu-24.04.ext4 firecracker-root/firecracker/1/root/
    cp -v vmlinux-6.1.128 firecracker-root/firecracker/1/root/
  ignore_errors: true

- name: Fix permissions for VM block device
  shell: chmod 1000 firecracker-root/firecracker/1/root/ubuntu-24.04.ext4
  # We'll run the jailer as user 1, so we need to ensure the block device is accessible
  # This should probably be fixed with chown instead

- name: Stop Firecracker VMs
  shell: pkill firecracker
  ignore_errors: true

- name: Start Firecracker VM
  shell: |
    jailer \
    --exec-file /usr/local/bin/firecracker \
    --id 1 \
    --uid 1000 --gid 1000 \
    --daemonize \
    --chroot-base-dir firecracker-root \
    -- --api-sock firecracker.socket --config-file vmconfig.json